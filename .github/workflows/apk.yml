# Gera o aplicativo Android (APK) do jogo e envia o arquivo para o site (FTP da Hostinger).
# Nada do APK fica no GitHub. A chave de assinatura e a conta FTP vêm dos segredos do repositório
# (Settings > Secrets and variables > Actions): APK_KEYSTORE_B64, APK_KEYSTORE_SENHA, FTP_HOST, FTP_USUARIO, FTP_SENHA
# e, opcional, FTP_PASTA (padrão public_html). Para rodar na mão: aba Actions > "Gerar APK" > Run workflow.
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apk/**"
      - ".github/workflows/apk.yml"
      - "*.html"
      - "css/**"
      - "js/**"
      - "fonts/**"
      - "icons/**"
      - "img/**"
      - "vendor/**"
      - "manifest.webmanifest"

permissions:
  contents: read

concurrency:
  group: gerar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apk
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk/package-lock.json

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm ci

      - name: Montar a pasta www com o jogo
        run: node scripts/preparar-www.js

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Limpar o cache do WebView quando o app for atualizado
        run: node scripts/limpar-cache-atualizacao.js

      - name: Gerar ícones e tela de abertura
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor "#1b5a4b" --iconBackgroundColorDark "#0b2e26"
          --splashBackgroundColor "#0f1715" --splashBackgroundColorDark "#0f1715"

      - name: Ícones do launcher nos tamanhos do Android
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/icones-android.py assets android/app/src/main/res ../icons

      - name: Versão
        run: node scripts/configurar-android.js
        env:
          NUMERO: ${{ github.run_number }}

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Chave de assinatura (vem dos segredos do repositório, nunca do código)
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_SENHA: ${{ secrets.APK_KEYSTORE_SENHA }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_SENHA" ]; then
            echo "::error::Faltam os segredos APK_KEYSTORE_B64 e APK_KEYSTORE_SENHA (Settings > Secrets and variables > Actions > New repository secret)."
            exit 1
          fi
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/assinatura.p12

      - name: Alinhar e assinar
        env:
          KS_SENHA: ${{ secrets.APK_KEYSTORE_SENHA }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --min-sdk-version 23 \
            --ks keystore/assinatura.p12 --ks-type PKCS12 --ks-key-alias misterio-sql \
            --ks-pass env:KS_SENHA --key-pass env:KS_SENHA \
            --out ../misterio-sql.apk alinhado.apk
          "$BT/apksigner" verify --verbose --print-certs ../misterio-sql.apk | head -12
          rm -f keystore/assinatura.p12

      - name: Conferir o arquivo
        run: |
          ls -la ../misterio-sql.apk
          unzip -l ../misterio-sql.apk | grep -E "assets/public/(index.html|vendor/pglite/postgres.wasm)" || (echo "faltam arquivos do jogo no APK" && exit 1)

      - name: Enviar o APK para o site (FTP da Hostinger)
        working-directory: ${{ github.workspace }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
          FTP_PASTA: ${{ secrets.FTP_PASTA }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USUARIO" ] || [ -z "$FTP_SENHA" ]; then
            echo "::error::Faltam os segredos FTP_HOST, FTP_USUARIO e FTP_SENHA (conta FTP da Hostinger). O APK não é guardado no GitHub."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USUARIO","$FTP_SENHA" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; cd ${FTP_PASTA:-public_html}; put -O . misterio-sql.apk; bye" "$FTP_HOST"
          echo "APK publicado em: https://linen-crab-866348.hostingersite.com/misterio-sql.apk"
